{% include base_path %}
<header class="masthead">
  <div class="site-header">
    <a class="site-name" href="{{ base_path }}/">{{ site.title }}</a>
    <nav aria-label="Main navigation">
      <ul class="site-links">
        {% for link in site.data.navigation.main %}
        <li><a href="{% unless link.url contains 'http' %}{{ base_path }}{% endunless %}{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
